name: Flutter
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze lib test
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: flutter test --reporter expanded --timeout 120s
        env:
          FFMPEG_TEST_PATH: /usr/bin/ffmpeg
